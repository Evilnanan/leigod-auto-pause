name: 雷神自动暂停

on:
  push:
    branches: [main]
    paths:
      - index.js
      - leigod.js
      - package.json
      - package-lock.json
      - .github/workflows/auto-pause.yml
  workflow_dispatch:
  schedule:
    # UTC 17:00 = 北京时间次日 01:00
    - cron: '0 17 * * *'

permissions:
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: 检查并暂停时长
        run: node index.js
        env:
          LEIGOD_TOKENS: ${{ secrets.LEIGOD_TOKENS }}
          USERNAME_ARR: ${{ secrets.USERNAME_ARR }}
          PASSWORD_ARR: ${{ secrets.PASSWORD_ARR }}
